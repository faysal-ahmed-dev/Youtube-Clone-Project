<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>

    <div id="main">

        <div id="grid">

            <div class="video-card">

                <div class="thumbnail">
                    <img class="image-thumbnail" src="resources/thumbnail/Thumbnail-1_mr_beast.jpg" alt="">
                </div>

                <div class="video-info">

                    <div class="avatar">
                        <img class="image-avatar" src="resources/avatar/Channel_profile-1_mr_beast.webp" alt="">
                    </div>

                    <div class="video-title-info">

                        <div class="title-box">

                            <div class="video-title">
                                <p>
                                We Survived The Most Extreme Places On Earth
                                </p>
                            </div>

                            <button class="three-dots"> &#x22EE;</button>

                        </div>

                        <p class="channel-name">
                            MrBeast
                        </p>

                        <p class="video-views">
                            7.4M views • 4 hours ago
                        </p>
                    </div>

                </div>



            </div>
        </div>
    </div>
    
</body>
</html>
